{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Contrast Enhancer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-light sidebar p-4">
                <h4>Image Enhancer</h4>
                
                <!-- Upload -->
                <div class="mb-4">
                    <label for="imageUpload" class="form-label">Upload Image (.jpg, .png)</label>
                    <input type="file" class="form-control" id="imageUpload" accept="image/jpeg,image/png">
                    <div id="uploadPreview" class="mt-2"></div>
                </div>
                
                <!-- Algorithm Selection -->
                <div class="mb-4">
                    <label for="algorithmSelect" class="form-label">Algorithm</label>
                    <select class="form-select" id="algorithmSelect">
                        <option value="" disabled selected>-- Chọn thuật toán --</option>
                        <option value="gamma">Gamma Correction</option>
                        <option value="log">Log Transformation</option>
                        <option value="stretch">Contrast Stretching</option>
                    </select>
                </div>
                
                <!-- Gamma Slider (hidden by default) -->
                <div id="gammaControls" class="mb-4" style="display: none;">
                    <label for="gammaSlider" class="form-label">Gamma (0.1 - 2.5)</label>
                    <input type="range" class="form-range" id="gammaSlider" min="0.1" max="2.5" step="0.1" value="1.0">
                    <div class="fw-bold" id="gammaValue">1.0</div>
                </div>
                
                <!-- Apply Button -->
                <button class="btn btn-primary w-100" id="applyBtn" disabled>Apply Enhancement</button>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="row">
                    <!-- Original Image -->
                    <div class="col-md-6">
                        <h5>Original Image</h5>
                        <div class="card">
                            <div class="card-body text-center">
                                <img id="originalImg" src="" class="img-fluid rounded shadow" style="max-height: 500px; display: none;">
                                <div id="originalPlaceholder" class="text-muted">
                                    <i class="fas fa-image fa-5x"></i>
                                    <p>Upload an image to view here</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Enhanced Image -->
                    <div class="col-md-6">
                        <h5>Enhanced Image</h5>
                        <div class="card">
                            <div class="card-body text-center">
                                <div class="spinner-border text-primary" role="status" id="loadingSpinner" style="display: none;">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <img id="enhancedImg" src="" class="img-fluid rounded shadow" style="max-height: 500px; display: none;">
                                <div id="enhancedPlaceholder" class="text-muted">
                                    <i class="fas fa-image fa-5x"></i>
                                    <p>Enhanced image will appear here</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
